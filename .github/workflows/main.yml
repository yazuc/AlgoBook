name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*.*' # Ex: v1.0.0

# Prevent duplicate workflows for the same tag
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.29.2
    - run: flutter pub get
    - run: flutter build apk
    - run: flutter build appbundle
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: android-aab
        path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter pub get
    - run: flutter build web
    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
          name: web
          path: build/web/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build windows
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release/

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Upload iOS Build Folder (optional, for archive)
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/iphoneos/

  release:
    needs: [build-android, build-web, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Remove duplicate files
        run: |
          find release-files -name 'CodeResources' -type f | tail -n +2 | xargs rm -f

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files/android-apk

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release-files/android-aab

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: release-files/web/

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release-files/windows/

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: release-files/ios/

      - name: Zip all build outputs
        run: |
          cd release-files
          zip -r android-apk.zip android-apk
          zip -r android-aab.zip android-aab
          zip -r web.zip web
          zip -r windows.zip windows
          zip -r ios.zip ios
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*.zip # Uploads all artifacts