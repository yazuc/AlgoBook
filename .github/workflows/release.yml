name: Create Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build release
        run: |
          flutter build web --release
          cd build/web
          zip -r ../../release-files/bookrithm-web.zip .
          cd ../..
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false 